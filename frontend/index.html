<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Comida Saludable - Generador de Planes Nutricionales</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="fas fa-apple-alt"></i> Comida Saludable
        </a>
    </div>
</nav>

<div class="container mt-4">
    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="display-4 text-success">Generador de Planes Nutricionales</h1>
        <div id="db-info" class="alert alert-info"></div>
    </div>

    <!-- Formulario de Usuario -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3><i class="fas fa-user"></i> Información Personal</h3>
                </div>
                <div class="card-body">
                    <!-- ⚠️ Cambiado id a "form" -->
                    <form id="form">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input
                                        type="text"
                                        class="form-control"
                                        id="nombre"
                                        name="nombre"
                                        required
                                />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input
                                        type="number"
                                        class="form-control"
                                        id="edad"
                                        name="edad"
                                        min="15"
                                        max="80"
                                        required
                                />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="peso" class="form-label">Peso (kg)</label>
                                <input
                                        type="number"
                                        class="form-control"
                                        id="peso"
                                        name="peso"
                                        min="40"
                                        max="200"
                                        step="0.1"
                                        required
                                />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="altura" class="form-label">Altura (cm)</label>
                                <input
                                        type="number"
                                        class="form-control"
                                        id="altura"
                                        name="altura"
                                        min="140"
                                        max="220"
                                        required
                                />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="sexo" class="form-label">Sexo</label>
                                <select
                                        class="form-select"
                                        id="sexo"
                                        name="sexo"
                                        required
                                >
                                    <option value="">Seleccionar...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3"></div>
                        </div>

                        <div class="mb-3">
                            <h3>Preferencias Alimenticias</h3>
                            <div id="preferencias-lista" class="checkbox-list"></div>

                            <h3>Condiciones Médicas</h3>
                            <div id="condiciones-lista" class="checkbox-list"></div>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="observaciones" class="form-label"
                            >Observaciones Adicionales</label
                            >
                            <textarea
                                    class="form-control"
                                    id="observaciones"
                                    name="observaciones"
                                    rows="3"
                            ></textarea>
                        </div>

                        <div class="d-grid">
                            <button
                                    type="submit"
                                    class="btn btn-success btn-lg"
                            >
                                <i class="fas fa-magic"></i> Generar Mi Plan Nutricional
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center mt-4" style="display: none;">
        <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Generando plan...</span>
        </div>
        <p class="mt-2">
            🧠 Analizando tus datos y generando plan personalizado...
        </p>
    </div>

    <!-- Resultados -->
    <!-- Contenedor de resultados -->
    <div id="resultados" style="display:none">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>Tu Plan Nutricional Personalizado</h3>
            </div>
            <div class="card-body" id="plan-content">
                <!-- Aquí inyecta JS: resumen calorías, botones de días, contenido de cada día… -->
            </div>
            <div class="text-end mb-3">
                <button class="btn btn-outline-secondary"
                        onclick="descargarPlan()">
                    <i class="fas fa-download"></i> Descargar Plan
                    <button onclick="compartirPlan()">🔗 Compartir Plan</button>
                </button>
            </div>
        </div>
    </div>
    <div id="alimentoModalContainer"></div>
    <!-- Alertas -->
    <div id="alerts"></div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p>&copy; 2025 Comida Saludable - Generador de Planes Nutricionales</p>
</footer>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida Saludable - Generador de Planes Nutricionales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-apple-alt"></i> Comida Saludable
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="display-4 text-success">Generador de Planes Nutricionales</h1>
            <div id="db-info" class="alert alert-info"></div>
        </div>

        <!-- Formulario de Usuario -->
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h3><i class="fas fa-user"></i> Información Personal</h3>
                    </div>
                    <div class="card-body">
                        <form id="userForm">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="nombre" class="form-label">Nombre Completo</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="edad" class="form-label">Edad</label>
                                    <input type="number" class="form-control" id="edad" name="edad" min="15" max="80" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="peso" class="form-label">Peso (kg)</label>
                                    <input type="number" class="form-control" id="peso" name="peso" min="40" max="200" step="0.1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="altura" class="form-label">Altura (cm)</label>
                                    <input type="number" class="form-control" id="altura" name="altura" min="140" max="220" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="sexo" class="form-label">Sexo</label>
                                    <select class="form-select" id="sexo" name="sexo" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="M">Masculino</option>
                                        <option value="F">Femenino</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="nivelActividad" class="form-label">Nivel de Actividad</label>
                                    <select class="form-select" id="nivelActividad" name="nivelActividad" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="sedentario">Sedentario (poco o ningún ejercicio)</option>
                                        <option value="ligero">Ligero (ejercicio ligero 1-3 días/semana)</option>
                                        <option value="moderado">Moderado (ejercicio moderado 3-5 días/semana)</option>
                                        <option value="activo">Activo (ejercicio intenso 6-7 días/semana)</option>
                                        <option value="muy_activo">Muy Activo (ejercicio muy intenso, trabajo físico)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="objetivo" class="form-label">Objetivo</label>
                                <select class="form-select" id="objetivo" name="objetivo">
                                    <option value="perder">Perder peso</option>
                                    <option value="mantener" selected>Mantener peso</option>
                                    <option value="ganar">Ganar peso</option>
                                </select>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-magic"></i> Generar Mi Plan Nutricional
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center mt-4" style="display: none;">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Generando plan...</span>
            </div>
            <p class="mt-2">🧠 Analizando tus datos y generando plan personalizado...</p>
        </div>

        <!-- Resultados -->
        <div id="resultados" class="mt-5" style="display: none;">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3><i class="fas fa-clipboard-list"></i> Tu Plan Nutricional Personalizado</h3>
                </div>
                <div class="card-body">
                    <div id="plan-content"></div>
                </div>
            </div>
        </div>

        <!-- Alertas -->
        <div id="alerts"></div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Comida Saludable - Generador de Planes Nutricionales</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
